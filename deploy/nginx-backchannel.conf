# Backchannel — nginx reverse proxy.
#
# Install as:  /etc/nginx/sites-available/backchannel
#   then:  ln -s ../sites-available/backchannel /etc/nginx/sites-enabled/backchannel
# Also install deploy/nginx-backchannel-app.conf as
#   /etc/nginx/snippets/backchannel-app.conf
#
# Each hostname gets ITS OWN server{} block with ITS OWN certificate. nginx
# picks the certificate for a connection from the server{} block, before it
# ever sees the HTTP Host header — so two hostnames with two different certs
# must never share one server{} block, or every client gets whichever cert
# was written into that block regardless of which name it asked for.
#
# The node process listens on 127.0.0.1:8787 and is NOT exposed directly.
#
# NOTE: backchannel.rpediter.com is DISABLED (commented out below) as of
# 2026-09-13 — not in active use. Its cert is left on disk under
# /etc/letsencrypt/live/backchannel.rpediter.com/ untouched in case it is
# reactivated later; just uncomment the block below and reload nginx.

# --- rate-limit buckets -------------------------------------------------------
# Only POST requests count toward the write bucket (empty key = not counted).
map $request_method $bc_is_write      { POST 1; default 0; }
map $bc_is_write    $bc_write_key     { 1 $binary_remote_addr; 0 ""; }

limit_req_zone  $binary_remote_addr  zone=bc_all:10m    rate=25r/s;
limit_req_zone  $bc_write_key        zone=bc_write:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=bc_conn:10m;

limit_req_status  429;
limit_conn_status 429;

upstream backchannel {
    server 127.0.0.1:8787;
    keepalive 32;
}

# --- primary domain (DISABLED — was backchannel.rpediter.com) -------------
# server {
#     listen      443 ssl http2 default_server;
#     listen [::]:443 ssl http2 default_server;
#     server_name backchannel.rpediter.com;
#
#     ssl_certificate     /etc/letsencrypt/live/backchannel.rpediter.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/backchannel.rpediter.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     include snippets/backchannel-app.conf;
# }

# --- secondary domain (now the only active one; made default_server) ------
server {
    listen      443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 0xai.backchannel.p-e.kr;

    ssl_certificate     /etc/letsencrypt/live/0xai.backchannel.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0xai.backchannel.p-e.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/backchannel-app.conf;
}

# --- plain HTTP: redirect every active Backchannel hostname to https ------
server {
    listen      80;
    listen [::]:80;
    server_name 0xai.backchannel.p-e.kr;
    return 301 https://$host$request_uri;
}
