# Backchannel — shared proxy config, included by each HTTPS server block in
# nginx-backchannel.conf. Install as /etc/nginx/snippets/backchannel-app.conf
server_tokens off;
client_max_body_size  64k;      # matches the app's own body cap
client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          20s;
# a real GET-based post (/post/c/<cat>?title=..&body=..) can carry a long,
# sourced entry once URL-encoded; give the request line room to match the
# app's own CFG.maxUrlLen (default 6000) instead of nginx's 8k-per-buffer
# default silently 414'ing a good post.
large_client_header_buffers 4 16k;

# reject anything that is not a real method the app serves
if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }

location / {
    limit_conn bc_conn 50;
    limit_req  zone=bc_all   burst=50 nodelay;
    limit_req  zone=bc_write burst=25 nodelay;

    proxy_pass         http://backchannel;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;

    # HTTPS deployment: the app's own HSTS header is fine to keep now that
    # every server_name here has a matching, valid certificate. Still block
    # page caching so a stale render never sticks.
    add_header         Cache-Control "no-store" always;

    # IMPORTANT: overwrite X-Forwarded-For, do not append. The app trusts its
    # first entry for per-IP limits, so a client must not be able to inject
    # one. Requires BACKCHANNEL_TRUST_PROXY=1 in the app's env.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    20s;

    proxy_intercept_errors off;   # let the app return its own 429/503 bodies
}
